<style>
:root{font:15px/1.5 system-ui,sans-serif;color:#162b35;background:#edf2f3;--line:#cfdbde;--teal:#086b69}
*{box-sizing:border-box}body{margin:0}header{background:#142d38;color:white;padding:1.3rem max(4vw,1rem);display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}header h1,.pane-bar h2,.help-heading h2,p{margin:0}header h1{font-size:1.5rem;letter-spacing:-.03em}.pane-bar h2{font-size:1rem}textarea:focus-visible{outline:2px solid #008b82;outline-offset:2px}
main{padding:1rem max(4vw,1rem);max-width:1900px;margin:auto}.panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}.card{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}.bar{padding:.7rem 1rem;background:#f7faf9;border-bottom:1px solid var(--line)}#source,#preview{width:100%;height:clamp(390px,62vh,850px);overflow:auto}#source{display:block;resize:vertical;border:0;padding:1rem;font:13px/1.65 ui-monospace,monospace;tab-size:4;color:inherit}#preview{overflow-anchor:none}:is(#preview,#help-preview){padding:1rem;overflow-wrap:break-word}:is(#preview,#help-preview) p{margin:.65em 0}:is(#preview,#help-preview) pre{overflow:auto;background:#f1f5f5;padding:.65rem}:is(#preview,#help-preview) a{color:#086865}:is(#preview,#help-preview) svg{display:block;max-width:none!important;height:auto;margin:auto}.diagram{overflow:auto;border:1px solid var(--line);border-radius:6px;padding:1rem;margin:1rem 0}table{border-collapse:collapse}th,td{border:1px solid var(--line);padding:.4rem .6rem;text-align:left}th{background:#f0f5f5}.muted{color:#46616b}.status:empty{display:none}.status{margin-top:.6rem;min-height:1.5em}.error{color:#9a231e}code{font-family:ui-monospace,monospace}@media(max-width:800px){.panes{grid-template-columns:1fr}#source,#preview{height:450px}}
/* HTML standard heading sizes and spacing for rendered Markdown. */
:is(#preview,#help-preview) h1{font-size:2em;margin-block:.67em}
:is(#preview,#help-preview) h2{font-size:1.5em;margin-block:.83em}
:is(#preview,#help-preview) h3{font-size:1.17em;margin-block:1em}
:is(#preview,#help-preview) h4{font-size:1em;margin-block:1.33em}
:is(#preview,#help-preview) h5{font-size:.83em;margin-block:1.67em}
:is(#preview,#help-preview) h6{font-size:.67em;margin-block:2.33em}
:is(#preview,#help-preview) > :first-child{margin-block-start:0}
:is(#preview,#help-preview) .diagram.dark{background:#151922;color:#fff}:is(#preview,#help-preview) .diagram svg{overflow:visible}
.filebar{display:flex;flex-wrap:wrap;align-items:center;gap:.55rem;margin-bottom:.75rem}
.filebar button{font:inherit;color:inherit;background:white;border:1px solid var(--line);border-radius:6px;padding:.4rem .75rem;cursor:pointer}
.filebar button:hover:not(:disabled){background:#e3efee}.filebar button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.filebar button:disabled{opacity:.55;cursor:default}#file-save{background:var(--teal);border-color:var(--teal);color:white}
#file-save:hover:not(:disabled){background:#095956}#file-state{margin-left:.35rem;overflow-wrap:anywhere}

@media (width > 800px) {
  body {
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
  }
  header,.filebar,.status { flex:none }
  main {
    display:flex;
    flex:1;
    flex-direction:column;
    width:100%;
    min-height:0;
  }
  .panes {
    flex:1;
    min-height:0;
    grid-template-rows:minmax(0,1fr);
    grid-template-columns:minmax(3.25rem,1fr) minmax(3.25rem,1fr);
  }
  .card {
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .bar { flex:none }
  #source,#preview {
    flex:1;
    height:auto;
    min-height:0;
  }
  #source { resize:none }
}

.help-button{margin-left:auto}
.help-dialog{width:min(64rem,calc(100% - 2rem));max-height:calc(100% - 2rem);margin:auto;padding:0;border:1px solid var(--line);border-radius:10px;color:inherit;background:white}
.help-dialog::backdrop{background:#142d38a6}
.help-content{display:flex;flex-direction:column;gap:.75rem;padding:1rem;height:min(47rem,calc(100vh - 2.25rem));height:min(47rem,calc(100dvh - 2.25rem));overflow:auto}
.help-heading,.help-actions{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.help-heading{justify-content:space-between}
#help-licenses{margin-inline-start:auto}
.help-heading h2{font-size:1.15rem}
.help-content button{font:inherit;color:inherit;background:#f7faf9;border:1px solid var(--line);border-radius:6px;padding:.4rem .75rem;cursor:pointer}
.help-content button:hover{background:#e3efee}
.help-content button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:white}
.help-content button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#help-example,#help-preview{flex:1;min-height:8rem;width:100%;overflow:auto;border:1px solid var(--line);border-radius:6px}
#help-example{resize:none;padding:.75rem;background:#f7faf9;color:inherit;font:13px/1.6 ui-monospace,monospace;tab-size:4}

.pane-bar{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.pane-toggle{flex:none;display:grid;place-items:center;width:2rem;height:2rem;padding:0;border:1px solid var(--line);border-radius:6px;background:white;color:inherit;font:inherit;cursor:pointer}
.pane-toggle:hover{background:#e3efee}
.pane-toggle:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.panes.has-collapsed-pane{grid-template-columns:minmax(3.25rem,0fr) minmax(3.25rem,1fr)}
.panes.has-collapsed-preview{grid-template-columns:minmax(3.25rem,1fr) minmax(3.25rem,0fr)}
@media (width > 800px) and (prefers-reduced-motion:no-preference) {
  .panes{transition:grid-template-columns 220ms ease-in-out}
}
.card.is-collapsed .pane-bar{flex-direction:column;justify-content:flex-start;gap:.8rem;height:100%;padding:.7rem .25rem;border-bottom:0}
.card.is-collapsed .pane-toggle{order:-1}
.card.is-collapsed h2{writing-mode:vertical-rl}
.card.is-collapsed #source,.card.is-collapsed #preview{display:none}
@media (max-width:800px) {
  .panes.has-collapsed-pane #source,.panes.has-collapsed-pane #preview {
    height:calc(100vh - 11rem);
    height:max(450px,calc(100dvh - 11rem));
  }
}
.developer-link{margin-inline-start:auto;color:#c4d5db;font-size:.9rem;text-decoration:none}
.developer-link:hover,.developer-link:focus-visible{color:white;text-decoration:underline}

<script id="help-examples" type="application/json">{"Guide": "# Guide till Markdowneditor\n\n- [Öppna och skapa dokument](#öppna-och-skapa-dokument)\n- [Spara och byt filnamn](#spara-och-byt-filnamn)\n- [Arbeta i rutorna](#arbeta-i-rutorna)\n- [Skriv Markdown](#skriv-markdown)\n- [Rita med Mermaid](#rita-med-mermaid)\n- [Hitta och kopiera exempel](#hitta-och-kopiera-exempel)\n- [När något saknas i förhandsgranskningen](#när-något-saknas-i-förhandsgranskningen)\n\n## Öppna och skapa dokument\n\n| Åtgärd | Så fungerar den |\n| --- | --- |\n| **Öppna fil** | Välj en lokal fil, till exempel `.md`, `.markdown` eller `.txt`. |\n| **Ny fil** | Startar ett tomt dokument och öppnar Markdownrutan. |\n| **Osparade ändringar** | Visas bredvid filnamnet. Editorn frågar innan du öppnar eller skapar ett annat dokument. |\n| **Lokalt utkast** | Editorn försöker komma ihåg texten i webbläsaren. Använd Spara när du vill skriva den till en fil. |\n\n## Spara och byt filnamn\n\n**Spara** skriver till den öppna filen när webbläsaren har direkt filåtkomst. För ett nytt dokument väljer du namn och plats första gången. **Spara som** öppnar ett nytt val. Om direkt filåtkomst saknas startar en nedladdning. Efter en omladdning kan du behöva välja filen igen eftersom filåtkomsten gäller under den öppna sessionen.\n\n| Genväg | Åtgärd |\n| --- | --- |\n| `Ctrl+S` eller `⌘S` | Spara |\n| `Ctrl+Shift+S` eller `⌘Shift+S` | Spara som |\n| `Esc` | Stäng hjälpen |\n\n## Arbeta i rutorna\n\nMarkdownrutan är hopfälld vid start. Öppna den med pilen i den vänstra kanten. Använd pilknapparna i rutornas överkant för att ge den andra rutan mer plats. När båda rutorna visas följer rullningen den relativa positionen i dokumentet. Diagram och tabeller kan göra att motsvarande stycken hamnar på olika höjd.\n\n## Skriv Markdown\n\nBörja med en rubrik med `#` och använd `##` och `###` för avsnitt. Lämna en tom rad mellan stycken. Under **Markdown** finns en exempelfil med bland annat tabeller, länkar, listor, checklistor, citat och kodblock.\n\n## Rita med Mermaid\n\nEtt Mermaid-diagram är ett kodblock som börjar med tre backticks följt av `mermaid` och slutar med tre backticks. Inuti blocket börjar du med diagramtypen, till exempel `flowchart LR`. För ett flödesschema kan du ändra riktningen med `LR`, `RL`, `TD` eller `BT`. ELK är förvald layoutmotor där diagramtypen stöder den. I flödesschemakoden kan du ange `layout: dagre` i ett konfigurationsblock för att jämföra.\n\n## Hitta och kopiera exempel\n\nVälj **Markdown** eller **Mermaid** och gå till det avsnitt du vill se via innehållsförteckningen i **Formaterat**. Växla till **Kod** för att markera den del du vill kopiera. **Kopiera hela exempelfilen** kopierar källtexten i båda lägena.\n\n## När något saknas i förhandsgranskningen\n\n- Kontrollera mellanslaget efter rubriktecknet och de tomma raderna mellan olika block.\n- Kontrollera att tabellen har en rad med bindestreck direkt under kolumnrubrikerna.\n- Kontrollera kodstaketen runt Mermaid-blocket och att diagramtypen är rättstavad. Editorn visar ett felmeddelande om diagrammet inte kan tolkas.\n- En bild med en relativ sökväg måste finnas på en plats som förhandsgranskningen kan nå.\n", "Markdown": "# Markdown från grunden till ett helt dokument\n\nHär är ett fiktivt exempel för ett projektteam. Växla till **Kod** för att se hur varje del är skriven.\n\n- [Rubriker och stycken](#rubriker-och-stycken)\n- [Formatering och specialtecken](#formatering-och-specialtecken)\n- [Listor och checklistor](#listor-och-checklistor)\n- [Citat och avdelare](#citat-och-avdelare)\n- [Länkar och bilder](#länkar-och-bilder)\n- [Tabeller](#tabeller)\n- [Kodblock och kommentarer](#kodblock-och-kommentarer)\n- [Mermaid i ett dokument](#mermaid-i-ett-dokument)\n\n## Rubriker och stycken\n\nStycken skiljs åt med en tom rad.\n\n### Rubriknivå 3\n\n#### Rubriknivå 4\n\n##### Rubriknivå 5\n\n###### Rubriknivå 6\n\nEtt omvänt snedstreck i slutet av en rad ger en avsiktlig radbrytning.\\\nDen här raden börjar direkt under den föregående.\n\nEtt alternativt sätt att skriva en underrubrik\n---------------------------------------------\n\n## Formatering och specialtecken\n\nSkriv **fetstil**, *kursiv*, ***båda samtidigt*** eller ~~genomstruket~~. Använd `rapport.md` för filnamn och inlinekod. Skriv \\` för en synlig backtick och \\* för en synlig asterisk.\n\n## Listor och checklistor\n\n- Förberedelser\n  - Samla in underlag\n  - Utse en granskare\n- Genomförande\n\n1. Skriv ett utkast.\n2. Be om synpunkter.\n   1. Läs igenom kommentarerna.\n   2. Sammanställ ändringar.\n3. Godkänn den slutliga versionen.\n\n- [x] Utkast klart\n- [ ] Granskning klar\n- [ ] Publicering klar\n\n## Citat och avdelare\n\n> Ta upp öppna frågor vid nästa arbetsmöte.\n>\n> > Spara beslutet i projektloggen.\n\n---\n\n## Länkar och bilder\n\n- [Hoppa till tabeller](#tabeller)\n- [Relativ fillänk](./rapport.md)\n- [Referenslänk][mermaid]\n- Automatisk länk med vinkelparenteser \u003chttps://example.org>\n\nEn bild skrivs med alternativtext, sökväg och valfri titel.\n\n```markdown\n![En översikt över projektet](./bilder/översikt.png \"Projektöversikt\")\n```\n\n[mermaid]: https://mermaid.ai/open-source/ \"Mermaid\"\n\n## Tabeller\n\n| Aktivitet | Status | Timmar |\n| :--- | :---: | ---: |\n| Förberedelser | Klar | 8 |\n| Granskning | Pågår | 4 |\n| Publicering | Planerad | 2 |\n\nEn lodrät stapel inuti en cell skrivs som `\\|`.\n\n| Text | Resultat |\n| --- | --- |\n| Plan \\| utfall | Samma cell |\n\n## Kodblock och kommentarer\n\n```json\n{\n  \"projekt\": \"Exempelprojekt\",\n  \"status\": \"pågår\",\n  \"antalUppgifter\": 2\n}\n```\n\n```csv\naktivitet,status\nFörberedelser,klar\nGranskning,pågår\n```\n\n````markdown\nSå visar du ett kodblock i ett annat kodblock.\n\n```text\nProjektet är klart.\n```\n````\n\n\u003c!-- Kommentaren ligger kvar i källtexten men visas inte i förhandsgranskningen. -->\n\n## Mermaid i ett dokument\n\nBeskriv processen med text och lägg diagrammet där det hör hemma.\n\n```mermaid\nflowchart LR\n    A[Skriv utkast] --> B[Granska]\n    B --> C[Publicera]\n```\n", "Mermaid": "# Mermaid-exempel\n\nKopiera hela kodblocket till ditt Markdown-dokument.\n\n- [Flödesschema från vänster till höger](#flödesschema-från-vänster-till-höger)\n- [Flödesschema med ELK](#flödesschema-med-elk)\n- [Flödesschema uppifrån och ned](#flödesschema-uppifrån-och-ned)\n- [TreeView](#treeview)\n- [Sekvensdiagram](#sekvensdiagram)\n- [Tillståndsdiagram](#tillståndsdiagram)\n- [Gantt-schema](#gantt-schema)\n- [Tidslinje](#tidslinje)\n- [Klassdiagram](#klassdiagram)\n- [ER-diagram](#er-diagram)\n- [Cirkeldiagram](#cirkeldiagram)\n- [Tankekarta](#tankekarta)\n- [XY-diagram](#xy-diagram)\n- [Flödesschema med grupper och stilar](#flödesschema-med-grupper-och-stilar)\n- [Användarresa](#användarresa)\n- [Kvadrantdiagram](#kvadrantdiagram)\n- [Sankeydiagram](#sankeydiagram)\n- [Gitgraf](#gitgraf)\n- [Kanban](#kanban)\n- [Blockdiagram](#blockdiagram)\n- [Radardiagram](#radardiagram)\n\n## Flödesschema från vänster till höger\n\n```mermaid\nflowchart LR\n    A[Skapa utkast] --> B{Godkänt?}\n    B -->|Ja| C[Publicera]\n    B -->|Nej| D[Revidera]\n    D --> B\n```\n\n## Flödesschema med ELK\n\n```mermaid\n---\nconfig:\n  layout: elk\n---\nflowchart LR\n    A[Start] --> B[Planera]\n    A --> C[Samla idéer]\n    B --> D[Granska plan]\n    C --> E[Sammanställ idéer]\n    D --> F[Slutför]\n    E --> F\n```\n\n## Flödesschema uppifrån och ned\n\n```mermaid\nflowchart TD\n    A[Projekt] --> B[Planering]\n    A --> C[Genomförande]\n    C --> D[Uppföljning]\n```\n\n## TreeView\n\n```mermaid\ntreeView-beta\n    Projekt/ ## Projektmapp\n        Planering/\n            plan.md ## Arbetsplan\n            risker.md ## Risklista\n        Resultat/\n            rapport.md ## Slutrapport\n```\n\n## Sekvensdiagram\n\n```mermaid\nsequenceDiagram\n    actor A as Besökare\n    participant B as Webbapp\n    participant C as Tjänst\n    A->>B: Öppna sidan\n    B->>C: Hämta innehåll\n    C-->>B: Returnera innehåll\n    B-->>A: Visa sidan\n```\n\n## Tillståndsdiagram\n\n```mermaid\nstateDiagram-v2\n    [*] --> Utkast\n    Utkast --> Granskning: Skicka in\n    Granskning --> Utkast: Begär ändring\n    Granskning --> Publicerad: Godkänn\n    Publicerad --> [*]\n```\n\n## Gantt-schema\n\n```mermaid\ngantt\n    title Exempelprojekt\n    dateFormat YYYY-MM-DD\n    axisFormat %d/%m\n    section Arbete\n    Planering :a, 2026-01-12, 2d\n    Granskning :b, after a, 2d\n    Klart :milestone, after b, 0d\n```\n\n## Tidslinje\n\n```mermaid\ntimeline\n    title Projektets milstolpar\n    Januari : Start\n    Februari : Granskning\n    Mars : Publicering\n```\n\n## Klassdiagram\n\n```mermaid\nclassDiagram\n    class Projekt {\n        +String namn\n    }\n    class Uppgift {\n        +String titel\n        +bool klar\n    }\n    Projekt \"1\" *-- \"1..*\" Uppgift : innehåller\n```\n\n## ER-diagram\n\n```mermaid\nerDiagram\n    PROJEKT ||--o{ UPPGIFT : innehåller\n    PROJEKT {\n        string id PK\n        string namn\n    }\n    UPPGIFT {\n        string id PK\n        string projektId FK\n        string titel\n    }\n```\n\n## Cirkeldiagram\n\n```mermaid\npie showData\n    title Status för uppgifter\n    \"Klart\" : 8\n    \"Pågår\" : 4\n    \"Planerat\" : 6\n```\n\n## Tankekarta\n\n```mermaid\nmindmap\n  root((Projekt))\n    Förberedelser\n      Mål\n      Tidplan\n    Genomförande\n      Uppgifter\n      Uppföljning\n```\n\n## XY-diagram\n\n```mermaid\nxychart-beta\n    title \"Avslutade uppgifter\"\n    x-axis [\"Vecka 1\", \"Vecka 2\", \"Vecka 3\", \"Vecka 4\"]\n    y-axis \"Antal\" 0 --> 12\n    line [2, 5, 8, 11]\n```\n\n## Flödesschema med grupper och stilar\n\n```mermaid\n---\nconfig:\n  layout: dagre\n  flowchart:\n    nodeSpacing: 60\n    rankSpacing: 80\n    curve: stepAfter\n---\nflowchart LR\n    subgraph Planering\n        A[Skapa plan] --> B[Granska plan]\n    end\n    B -->|Godkänd| C([Starta projekt])\n    B -.->|Ändring behövs| A\n    classDef klar fill:#d9f3e8,stroke:#23765c,color:#16352d\n    class C klar\n```\n\n## Användarresa\n\n```mermaid\njourney\n    title Beställa en bok\n    section Sök\n      Hitta boken: 5: Besökare\n      Läs beskrivningen: 4: Besökare\n    section Beställ\n      Lägg i varukorg: 4: Besökare\n      Bekräfta: 5: Besökare, Webbapp\n```\n\n## Kvadrantdiagram\n\n```mermaid\nquadrantChart\n    title Prioritering av idéer\n    x-axis Låg insats --> Hög insats\n    y-axis Låg nytta --> Hög nytta\n    quadrant-1 Planera\n    quadrant-2 Gör först\n    quadrant-3 Överväg\n    quadrant-4 Avvakta\n    Förbättra sök: [0.28, 0.83]\n    Byt plattform: [0.79, 0.77]\n    Uppdatera mall: [0.21, 0.46]\n```\n\n## Sankeydiagram\n\n```mermaid\nsankey-beta\nInkomna,Granskade,12\nInkomna,Parkerade,5\nGranskade,Godkanda,8\nGranskade,Revision,4\n```\n\n## Gitgraf\n\n```mermaid\ngitGraph\n    commit id: \"Start\"\n    branch forbattring\n    checkout forbattring\n    commit id: \"Lägg till sök\"\n    checkout main\n    commit id: \"Justera startsida\"\n    merge forbattring\n```\n\n## Kanban\n\n```mermaid\nkanban\n    todo[Att göra]\n        t1[Samla idéer]\n    doing[Pågår]\n        t2[Skriv utkast]\n    done[Klart]\n        t3[Avgränsa uppgiften]\n```\n\n## Blockdiagram\n\n```mermaid\nblock-beta\n    columns 3\n    A[\"Besökare\"] B[\"Webbapp\"] C[\"Datakälla\"]\n    A --> B\n    B --> C\n```\n\n## Radardiagram\n\n```mermaid\nradar-beta\n    title Utvärdering av två förslag\n    axis a[\"Kostnad\"], b[\"Enkelhet\"], c[\"Flexibilitet\"], d[\"Underhåll\"]\n    curve x[\"Förslag A\"]{4, 5, 3, 4}\n    curve y[\"Förslag B\"]{3, 4, 5, 3}\n    max 5\n    min 0\n```\n"}</script>
<script id="initial-data" type="application/json">{"markdown": "# Välkommen till Markdowneditor\n\nHär kan du skriva Markdown och se resultatet direkt. Öppna Hjälp för fler exempel.\n\n```mermaid\nflowchart LR\n    A[Skapa utkast] --> B{Godkänt?}\n    B -->|Ja| C[Publicera]\n    B -->|Nej| D[Revidera]\n    D --> B\n```\n"}</script>
<!-- BUNDLED_LIBRARIES -->
<script>
const byId = id => document.getElementById(id);
const initial = JSON.parse(byId('initial-data').textContent);
const source = byId('source');
const preview = byId('preview');
const status = byId('status');
const storageKey = 'markdowneditor-public-v1';
let sequence = 0;
let renderVersion = 0;
let renderTimer;
let renderQueue = Promise.resolve();
const engine = globalThis.mermaid;
engine.initialize({startOnLoad:false,securityLevel:'strict',suppressErrorRendering:true,layout:'elk'});
const fileInput = byId('file-input');
const fileState = byId('file-state');
const fileButtons = [...document.querySelectorAll('.filebar button:not(.help-button)')];
const pickerOptions = {
  id: 'markdowneditor',
  types: [{description:'Markdown och text',accept:{'text/plain':['.md','.markdown','.txt']}}]
};
const defaultName = 'Ny fil.md';
let fileHandle = null;
let fileName = 'Exempel.md';
let savedText = initial.markdown;
let lineEnding = '\n';
let busy = false;
let downloadOnly = typeof window.showSaveFilePicker !== 'function';

source.value = initial.markdown;
try {
  const draft = JSON.parse(localStorage.getItem(storageKey));
  if (typeof draft?.markdown === 'string') {
    source.value = draft.markdown;
    fileName = draft.fileName || fileName;
    if (typeof draft.savedText === 'string') savedText = draft.savedText;
    if (draft.lineEnding === '\r\n') lineEnding = draft.lineEnding;
  }
} catch { /* Lokalt utkast kan saknas eller vara otillgängligt. */ }

function isDirty() {
  return source.value !== savedText;
}

function updateFileState() {
  fileState.textContent = fileName + (isDirty() ? ' · Osparade ändringar' : '');
}

function remember() {
  try {
    localStorage.setItem(storageKey, JSON.stringify({
      markdown:source.value, fileName, savedText, lineEnding
    }));
  } catch { /* Filhanteringen fungerar även utan lokala utkast. */ }
}

function switchDocument(text, name, handle = null) {
  clearTimeout(renderTimer);
  source.value = text;
  fileName = name;
  fileHandle = handle;
  savedText = source.value;
  lineEnding = /\r\n/.test(text) && !/(^|[^\r])\n/.test(text) ? '\r\n' : '\n';
  source.scrollTop = 0;
  preview.scrollTop = 0;
  updateFileState();
  remember();
  status.textContent = '';
  render();
}

function canSwitchDocument() {
  return !isDirty() || window.confirm('Dokumentet har osparade ändringar. Vill du fortsätta?');
}

async function runFileAction(action) {
  if (busy) return;
  busy = true;
  source.readOnly = true;
  for (const button of fileButtons) button.disabled = true;
  status.textContent = '';
  try {
    await action();
  } catch (error) {
    if (error.name !== 'AbortError') {
      status.textContent = 'Filåtgärden misslyckades. ' + error.message;
    }
  } finally {
    busy = false;
    source.readOnly = false;
    for (const button of fileButtons) button.disabled = false;
  }
}

function pickerUnavailable(error) {
  return error.name === 'SecurityError' || error.name === 'NotSupportedError';
}

function openFile() {
  if (busy || !canSwitchDocument()) return;
  if (typeof window.showOpenFilePicker !== 'function') {
    fileInput.click();
    return;
  }
  runFileAction(async () => {
    let handle;
    try {
      [handle] = await window.showOpenFilePicker(pickerOptions);
    } catch (error) {
      if (!pickerUnavailable(error)) throw error;
      fileInput.click();
      return;
    }
    const file = await handle.getFile();
    switchDocument(await file.text(), file.name, handle);
  });
}

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  fileInput.value = '';
  if (file) runFileAction(async () => switchDocument(await file.text(), file.name));
});

function downloadFile(content) {
  const url = URL.createObjectURL(new Blob([content], {type:'text/plain;charset=utf-8'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = fileName;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  status.textContent = 'Nedladdning startad. Välj målfil i webbläsaren om du vill ersätta en befintlig fil.';
}

function saveFile(saveAs = false) {
  runFileAction(async () => {
    const markdown = source.value;
    const content = lineEnding === '\r\n' ? markdown.replaceAll('\n','\r\n') : markdown;
    let handle = saveAs ? null : fileHandle;
    if (!handle && !downloadOnly) {
      try {
        handle = await window.showSaveFilePicker({...pickerOptions,suggestedName:fileName});
      } catch (error) {
        if (!pickerUnavailable(error)) throw error;
        downloadOnly = true;
      }
    }
    if (!handle) {
      if (saveAs || fileName === defaultName) {
        const name = window.prompt('Filnamn',fileName)?.trim();
        if (!name) return;
        fileName = /\.(md|markdown|txt)$/i.test(name) ? name : name + '.md';
      }
      downloadFile(content);
      updateFileState();
      remember();
      return;
    } else {
      const writer = await handle.createWritable();
      try {
        await writer.write(content);
        await writer.close();
      } catch (error) {
        await writer.abort().catch(() => {});
        throw error;
      }
      fileHandle = handle;
      fileName = handle.name;
      status.textContent = 'Sparat i ' + fileName + '.';
    }
    savedText = markdown;
    updateFileState();
    remember();
  });
}

byId('file-new').addEventListener('click', () => {
  if (busy || !canSwitchDocument()) return;
  switchDocument('',defaultName);
  if (collapsedPane?.content === source) togglePane(collapsedPane);
  source.focus();
});
byId('file-open').addEventListener('click',openFile);
byId('file-save').addEventListener('click',() => saveFile());
byId('file-save-as').addEventListener('click',() => saveFile(true));
document.addEventListener('keydown', event => {
  if (helpDialog.open || !(event.ctrlKey || event.metaKey) || event.altKey || event.key.toLowerCase() !== 's') return;
  event.preventDefault();
  if (!event.repeat) saveFile(event.shiftKey);
});
window.addEventListener('beforeunload', event => {
  if (!isDirty()) return;
  event.preventDefault();
  event.returnValue = '';
});

updateFileState();

const lastScrollTop = new Map([[source, source.scrollTop], [preview, preview.scrollTop]]);
let updatingPreview = false;

function syncScroll(from, to) {
  const fromRange = from.scrollHeight - from.clientHeight;
  const toRange = to.scrollHeight - to.clientHeight;
  if (fromRange <= 0 || toRange <= 0) return;
  const progress = Math.min(1, Math.max(0, from.scrollTop / fromRange));
  to.scrollTop = progress * toRange;
  lastScrollTop.set(to, to.scrollTop);
}

function onPaneScroll(from, to) {
  const position = from.scrollTop;
  if (lastScrollTop.get(from) === position) return;
  lastScrollTop.set(from, position);
  if (resizingPanes || (from === preview && updatingPreview)) return;
  syncScroll(from, to);
}

source.addEventListener('scroll', () => onPaneScroll(source, preview), {passive:true});
preview.addEventListener('scroll', () => onPaneScroll(preview, source), {passive:true});

const editorPanes = byId('editor-panes');
const paneControls = [
  {content:source, card:byId('source-card'), button:byId('toggle-source'), name:'Markdown'},
  {content:preview, card:byId('preview-card'), button:byId('toggle-preview'), name:'förhandsgranskningen'}
];
let collapsedPane = paneControls[0];
let paneLayoutVersion = 0;
let resizingPanes = false;

function togglePane(pane) {
  const previousVisible = collapsedPane
    ? paneControls.find(control => control !== collapsedPane)
    : paneControls.find(control => control !== pane);
  const previousRange = previousVisible.content.scrollHeight - previousVisible.content.clientHeight;
  const progress = previousRange > 0 ? previousVisible.content.scrollTop / previousRange : 0;

  const version = ++paneLayoutVersion;
  resizingPanes = true;
  collapsedPane = collapsedPane === pane ? null : pane;
  editorPanes.classList.toggle('has-collapsed-pane', Boolean(collapsedPane));
  editorPanes.classList.toggle('has-collapsed-preview', collapsedPane?.content === preview);
  for (const control of paneControls) {
    const collapsed = control === collapsedPane;
    const label = (collapsed ? 'Visa ' : 'Fäll ihop ') + control.name;
    control.card.classList.toggle('is-collapsed', collapsed);
    control.button.setAttribute('aria-expanded', String(!collapsed));
    control.button.setAttribute('aria-label', label);
    control.button.title = label;
    control.button.textContent = (collapsed === (control.content === source)) ? '›' : '‹';
  }

  function restoreScroll() {
    if (version !== paneLayoutVersion) return;
    for (const {content} of paneControls) {
      const range = Math.max(0, content.scrollHeight - content.clientHeight);
      if (range > 0) content.scrollTop = progress * range;
      lastScrollTop.set(content, content.scrollTop);
    }
    resizingPanes = false;
  }

  const slide = editorPanes.getAnimations?.().find(animation => animation.transitionProperty === 'grid-template-columns');
  if (slide) slide.finished.then(restoreScroll, restoreScroll);
  else restoreScroll();
}

for (const pane of paneControls) {
  pane.button.addEventListener('click', () => togglePane(pane));
}

async function renderMarkdown(markdown, target, isCurrent) {
  const fragment = DOMPurify.sanitize(marked.parse(markdown), {RETURN_DOM_FRAGMENT:true});
  const headings = new Map();
  for (const heading of fragment.querySelectorAll('h1,h2,h3,h4,h5,h6')) {
    const slug = heading.textContent.toLowerCase().trim().replace(/[^\p{L}\p{N}_ -]/gu,'').replaceAll(' ','-');
    const count = headings.get(slug) || 0;
    heading.id = count ? slug + '-' + count : slug;
    headings.set(slug,count + 1);
  }
  const diagrams = [];
  for (const code of fragment.querySelectorAll('pre > code.language-mermaid')) {
    const figure = document.createElement('div');
    figure.className = 'diagram';
    figure.textContent = 'Renderar diagram…';
    diagrams.push([figure,code.textContent]);
    code.parentElement.replaceWith(figure);
  }
  target.replaceChildren(fragment);
  for (const [figure, definition] of diagrams) {
    if (!isCurrent()) return;
    try {
      const result = await engine.render('mermaid-' + (++sequence),definition);
      if (isCurrent()) {
        figure.classList.toggle('dark', /dark/.test(engine.mermaidAPI.getConfig().theme));
        figure.innerHTML = result.svg;
        const svg = figure.querySelector('svg');
        const box = svg?.viewBox.baseVal;
        if (box?.width > 0 && box.height > 0) {
          svg.style.width = box.width + 'px';
        }
      }
    } catch (error) {
      figure.classList.add('error');
      figure.textContent = 'Mermaid kunde inte tolka diagrammet. ' + (error?.message || String(error));
    }
  }
}

function render() {
  const version = ++renderVersion;
  const markdown = source.value;
  const isCurrent = () => version === renderVersion;
  renderQueue = renderQueue.catch(() => {}).then(async () => {
    if (!isCurrent()) return;
    updatingPreview = true;
    await renderMarkdown(markdown, preview, isCurrent);
    if (isCurrent()) syncScroll(source, preview);
  }).catch(error => {
    status.textContent = 'Kunde inte visa förhandsgranskningen. ' + error.message;
  }).finally(() => {
    lastScrollTop.set(preview, preview.scrollTop);
    updatingPreview = false;
  });
}

source.addEventListener('input',() => {
  updateFileState();
  remember();
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render,220);
});
function followPreviewLink(event) {
  const link = event.target.closest('a[href^="#"]');
  if (!link) return;
  event.preventDefault();
  const pane = event.currentTarget;
  let id;
  try { id = decodeURIComponent(link.getAttribute('href').slice(1)); }
  catch { return; }
  [...pane.querySelectorAll('[id]')].find(element => element.id === id)?.scrollIntoView({block:'start'});
}

preview.addEventListener('click',followPreviewLink);


const helpDialog = byId('editor-help');
const helpExample = byId('help-example');
const helpPreview = byId('help-preview');
const helpInstructions = byId('help-instructions');
const helpFormatted = byId('help-formatted');
const helpCode = byId('help-code');
const helpStatus = byId('help-status');
const helpExamples = JSON.parse(byId('help-examples').textContent);
helpExamples['Om och licenser'] = byId('release-licenses').textContent;
const helpTabs = {'Om och licenser':byId('help-licenses'), Guide:byId('help-guide'), Markdown:byId('help-markdown'), Mermaid:byId('help-mermaid')};
const helpCopy = byId('help-copy');
let helpRenderVersion = 0;

function renderHelpExample() {
  const version = ++helpRenderVersion;
  const isCurrent = () => version === helpRenderVersion && helpDialog.open && !helpPreview.hidden;
  if (!isCurrent()) return;
  const markdown = helpExample.value;
  helpPreview.textContent = 'Visar exempel…';
  renderQueue = renderQueue.catch(() => {}).then(async () => {
    if (isCurrent()) await renderMarkdown(markdown, helpPreview, isCurrent);
  }).catch(error => {
    if (isCurrent()) helpPreview.textContent = 'Kunde inte visa exemplet. ' + error.message;
  });
}

function setHelpMode(showCode) {
  helpExample.hidden = !showCode;
  helpPreview.hidden = showCode;
  helpFormatted.setAttribute('aria-pressed', String(!showCode));
  helpCode.setAttribute('aria-pressed', String(showCode));
  helpInstructions.textContent = showCode
    ? 'Markera ett avsnitt för att kopiera det, eller använd kopieringsknappen för hela texten.'
    : 'Växla till Kod för att markera och kopiera delar av texten.';
  helpStatus.textContent = '';
  renderHelpExample();
}

helpPreview.addEventListener('click',followPreviewLink);
helpFormatted.addEventListener('click', () => setHelpMode(false));
helpCode.addEventListener('click', () => setHelpMode(true));

function showHelpExample(name) {
  for (const [label, button] of Object.entries(helpTabs)) {
    button.setAttribute('aria-pressed', String(label === name));
  }
  helpExample.value = helpExamples[name];
  helpExample.setAttribute('aria-label', name + ' i Markdown');
  helpCopy.textContent = name === 'Guide' ? 'Kopiera guiden' : 'Kopiera hela exempelfilen';
  helpExample.setSelectionRange(0, 0);
  helpExample.scrollTop = 0;
  helpExample.scrollLeft = 0;
  helpPreview.scrollTop = 0;
  helpStatus.textContent = '';
  renderHelpExample();
}

showHelpExample('Guide');
byId('help-open').addEventListener('click', () => {
  helpStatus.textContent = '';
  helpDialog.showModal();
  renderHelpExample();
});
for (const [name, button] of Object.entries(helpTabs)) {
  button.addEventListener('click', () => showHelpExample(name));
}

helpCopy.addEventListener('click', async () => {
  const text = helpExample.value;
  let copied = false;
  try {
    await navigator.clipboard.writeText(text);
    copied = true;
  } catch {
    if (!helpDialog.open || helpExample.value !== text) return;
    setHelpMode(true);
    helpExample.focus();
    helpExample.select();
    try { copied = document.execCommand('copy'); }
    catch { /* Behåll markeringen för manuell kopiering. */ }
  }
  if (!helpDialog.open || helpExample.value !== text) return;
  helpStatus.textContent = copied
    ? 'Texten kopierades.'
    : 'Texten är markerad. Använd Ctrl+C eller ⌘C för att kopiera.';
});

render();
</script>
